{% extends 'base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <a href="{% url 'post_list' %}" class="btn btn-sm btn-outline-secondary mb-4">
            <i class="bi bi-arrow-left"></i> Артқа
        </a>

        <div class="card post-card">
            <div class="card-body p-4 p-md-5">
                <h1 class="fw-bold mb-2">{{ post.title }}</h1>
                <p class="text-muted mb-4">
                    <i class="bi bi-calendar3 me-1"></i>{{ post.created|date:"d.m.Y H:i" }}
                </p>
                <hr class="mb-4">
                <div class="fs-5 lh-lg">
                    {{ post.body|linebreaks }}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
